name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Tests and coverage gate
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Build distribution
        run: python -m build
      - name: CLI smoke test
        run: python -m automation_toolkit --input examples/sample_sales_dirty.csv --output reports --format all --config config.yaml
      - name: Upload reports and coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: demo-reports-and-coverage
          path: |
            reports/
            coverage.xml
          retention-days: 14
