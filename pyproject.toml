[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-automation-toolkit"
version = "1.0.0"
description = "Configurable sales data validation, analytics and automated Excel/PDF reports"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Davorin Milicevic"}]
dependencies = ["pandas>=2.2,<4", "openpyxl>=3.1,<4", "matplotlib>=3.8,<4", "reportlab>=4.1,<5", "PyYAML>=6,<7"]

[project.optional-dependencies]
gui = ["customtkinter>=5.2,<6"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "build>=1.2,<2", "pypdf>=5,<8"]

[project.scripts]
automation-toolkit = "automation_toolkit.cli:main"
automation-toolkit-gui = "automation_toolkit.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["automation_toolkit"]
omit = ["*/gui/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
